<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale-1.0" />
    <link rel="stylesheet" href="./styles/styles.css"
    <title>Home- Sierra Merrick's portfolio</title>
  </head>

  <body>
    <header id="page-header">
      <a href="/" class="logo">
      <img src="./images/logo 1.svg" width="48px" height="48px" />
      </a>
      Sierra Merrick
      <nav id="main-nav">
        <ul>
          <li><a href="./">Home</a></li>
          <li><a href="resume.html">Resume</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="hero-image">
        <p class="display-text">
          Software Engineering Student
        </p>
        <button>View Work</button>
      </section>
    <h1>Home</h1>
    <section id="contact-form">
      <form>
        <h2>Contact Me</h2>
        <br>

        <div>
          <label for="fname">First name:</label>
          <input id="fname" type="text" name="name" required>
        </div>

        <br>

        <div>
          <label for="lname">Last name:</label>
          <input id="lname" type="text" name="name" required>
        </div>

        <br>

        <div>
          <label for="email">Email:</label>
          <input id="email" type="email" name="email" placeholder="name@example.com" required>
        </div>

        <br>

        <div>
          <label for="message">Message:</label>
          <br>
          <textarea id="message" name="message" rows="5" cols="50" required></textarea>
        </div>

        <br>

        <div>
          <button type="submit">Get in touch</button>
        </div>

      </form>
    </section>
    </main>
  </body>
</html>
