<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/bento-styles.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap');
    </style>
    <title>Bento Grid</title>
</head>
<body>
    <main>
        <section class="bento-container">

            <div class="grid-item long">
                <img src="./images/cuddle.jpg"/>
            </div>
            <div class="grid-item wide">
                <img src="./images/loaf.jpg"/>
            </div>
            <div class="grid-item long">
                <img src="./images/sinkguy.jpg"/>
            </div>
            <div class="grid-item wide title">
                <h1>Branjamin</h1>
            </div>
            <div class="grid-item wide">
                <img src="./images/stretchy.jpg"/>
            </div>
            <div class="grid-item wide">
                <img src="./images/yawn.jpg">
            </div>

        </section>
    </main>
</body>
</html>
